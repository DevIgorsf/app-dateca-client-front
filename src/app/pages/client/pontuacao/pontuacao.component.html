<div class="ranking">
  <div class="ranking__header">
    <a class="ranking__back" role="button" routerLink="/client/dashboard" aria-label="Voltar">
      <mat-icon aria-hidden="false" fontIcon="arrow_back"></mat-icon>
    </a>
    <h1 class="ranking__title">Ranking</h1>
  </div>

  <mat-tab-group class="ranking__tabs" animationDuration="200ms">
    <mat-tab label="🌍 Ranking Geral">
      <div class="ranking__tab-panel">
        @if (geralLoading()) {
          <app-ranking-skeleton />
        } @else {
          @if (myGeralEntry(); as me) {
            <app-my-position-card [position]="me.position" [points]="me.points" label="no Ranking Geral" />
          }
          <app-ranking-list [entries]="geralEntries()" />
        }
      </div>
    </mat-tab>

    <mat-tab label="👥 Ranking dos Amigos">
      <div class="ranking__tab-panel">
        @if (amigosLoading()) {
          <app-ranking-skeleton />
        } @else if (amigosEntries().length === 0) {
          <app-empty-state
            icon="group_add"
            title="Você ainda não possui amigos."
            description="Adicione amigos para competir e acompanhar seu desempenho entre pessoas que você conhece."
            actionLabel="Encontrar Amigos"
            actionLink="/client/adicionar" />
        } @else {
          @if (myAmigosEntry(); as me) {
            <app-my-position-card [position]="me.position" [points]="me.points" label="entre seus amigos" />
          }
          <app-ranking-list [entries]="amigosEntries()" emptyMessage="Nenhum amigo pontuou ainda." />
        }
      </div>
    </mat-tab>
  </mat-tab-group>
</div>
