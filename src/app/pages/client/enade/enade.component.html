<div class="qpage">
  <div class="qpage__header">
    <a class="qpage__back" role="button" routerLink="/client/dashboard" aria-label="Voltar">
      <mat-icon aria-hidden="false" fontIcon="arrow_back"></mat-icon>
    </a>
    <h1 class="qpage__title">Enade</h1>
  </div>

  <mat-card class="qpage__card">
    <span class="qpage__meta">{{ year }} · Questão {{ number }}</span>

    <div class="qpage__carousel" *ngIf="images && images.length > 0">
      <button class="qpage__carousel-btn" type="button" (click)="prevSlide()" aria-label="Imagem anterior">
        <mat-icon aria-hidden="false" fontIcon="chevron_left"></mat-icon>
      </button>
      <div class="qpage__slides">
        <div *ngFor="let image of images; let i = index">
          <img
            *ngIf="i === slideIndex"
            class="qpage__slide-image"
            [src]="image"
            alt="Imagem {{ i + 1 }} de {{ images.length }}" />
        </div>
      </div>
      <button class="qpage__carousel-btn" type="button" (click)="nextSlide()" aria-label="Próxima imagem">
        <mat-icon aria-hidden="false" fontIcon="chevron_right"></mat-icon>
      </button>
    </div>

    <div class="qpage__indicators" *ngIf="images && images.length > 1">
      <button
        class="qpage__indicator"
        type="button"
        *ngFor="let image of images; let i = index"
        [class.qpage__indicator--active]="i === slideIndex"
        [attr.aria-label]="'Ir para imagem ' + (i + 1)"
        (click)="goToSlide(i)"
        (keydown)="onKeydown($event, i)">
      </button>
    </div>

    <p class="qpage__statement">Enunciado: {{ statement }}</p>

    <form [formGroup]="formulario">
      <mat-radio-group aria-label="Selecione uma alternativa" formControlName="correctAnswer" class="qpage__choices">
        <label class="choice" [class.choice--selected]="formulario.value.correctAnswer === 'A'">
          <mat-radio-button value="A"></mat-radio-button>
          <span class="choice__letter">A</span>
          <span class="choice__text">{{ alternativeA }}</span>
        </label>

        <label class="choice" [class.choice--selected]="formulario.value.correctAnswer === 'B'">
          <mat-radio-button value="B"></mat-radio-button>
          <span class="choice__letter">B</span>
          <span class="choice__text">{{ alternativeB }}</span>
        </label>

        <label class="choice" [class.choice--selected]="formulario.value.correctAnswer === 'C'">
          <mat-radio-button value="C"></mat-radio-button>
          <span class="choice__letter">C</span>
          <span class="choice__text">{{ alternativeC }}</span>
        </label>

        <label class="choice" [class.choice--selected]="formulario.value.correctAnswer === 'D'">
          <mat-radio-button value="D"></mat-radio-button>
          <span class="choice__letter">D</span>
          <span class="choice__text">{{ alternativeD }}</span>
        </label>

        <label class="choice" [class.choice--selected]="formulario.value.correctAnswer === 'E'">
          <mat-radio-button value="E"></mat-radio-button>
          <span class="choice__letter">E</span>
          <span class="choice__text">{{ alternativeE }}</span>
        </label>
      </mat-radio-group>

      <div class="qpage__actions">
        <button class="qpage__button" type="button" (click)="answerEnade()" [disabled]="!formulario.valid">
          <mat-icon aria-hidden="false" fontIcon="check"></mat-icon>
          <span>Responder</span>
        </button>
      </div>
    </form>
  </mat-card>
</div>
